name: Daily Auto Redeploy

on:
  schedule:
    # 每天北京时间 13:20 运行（UTC 05:20）
    - cron: "20 5 * * *"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "错误: 未找到 VERCEL_DEPLOY_HOOK，请检查 Secrets 配置！"
            exit 1
          fi
          echo "正在触发 Vercel 重新构建部署..."
          curl -X POST "$VERCEL_DEPLOY_HOOK"
          echo "触发完成！"
